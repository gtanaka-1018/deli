project_id = "okumeter-ranking"

[auth]
site_url = "https://okumeter.com"
additional_redirect_urls = [
  "https://okumeter.com/?screen=ranking",
  "https://delilog.vercel.app/?screen=ranking",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
